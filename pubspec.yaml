name: doji_app
description: "doji — trading discipline, not signals. iOS, Android and Windows."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State and routing
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0

  # Backend and config (keys come from --dart-define or assets/env/.env)
  supabase_flutter: ^2.18.0
  flutter_dotenv: ^6.0.1

  # Local-first onboarding answers
  shared_preferences: ^2.5.5

  # Platform services, each wrapped behind an interface in lib/
  # 12.x: 13.x pulls permission_handler_android 14 (AGP 9 only); Flutter 3.38 ships AGP 8.
  permission_handler: ^12.0.1
  speech_to_text: ^7.4.0
  connectivity_plus: ^7.3.1 # offline state: "> connection lost. your answers are saved._"
  flutter_timezone: ^5.1.0 # IANA zone for the sessions step (Dart only exposes the abbreviation)

  flutter_svg: ^2.3.0
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  local_auth: ^3.0.2
  clock: ^1.1.2
  window_manager: ^0.5.2
  timezone: ^0.11.1
  # Deriv's public websocket (synthetics prices). Already in the tree via supabase.
  web_socket_channel: ^3.0.3
  # 1b "remind me" (Reminders in core/platform). 23.x needs Flutter 3.44.
  flutter_local_notifications: ^22.3.2
  file_picker: ^13.3.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    # Optional local config. Copy .env.example to assets/env/.env; --dart-define wins.
    - assets/env/

  # Bundled so Windows works offline. OFL licence: assets/fonts/OFL.txt
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700

# Handoff S0: the app icon centred on #050607. PNGs are exported from
# assets/svg/doji-app-icon.svg by tool/export_brand_assets_test.dart.
flutter_native_splash:
  color: "#050607"
  image: assets/splash/splash_icon.png
  android_12:
    image: assets/splash/splash_icon_android12.png
    color: "#050607"
  android: true
  ios: true
  web: false

# Square master; the stores apply their own masks (design system › App icon).
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: "ic_launcher"
  adaptive_icon_background: "#0F1113"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
