<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
</helmet>
<div data-screen-label="{{ label }}" style="position:relative;width:{{ box.w }}px;height:{{ box.h }}px;overflow:hidden;flex:none;border-radius:{{ box.r }}px;">
  <div style="position:absolute;left:0;top:0;width:1080px;height:{{ H }}px;transform:scale({{ s }});transform-origin:0 0;box-sizing:border-box;padding:{{ pad }}px;background:#050607;font-family:'Geist',system-ui,sans-serif;color:#F5F5F7;display:flex;flex-direction:column;gap:{{ gap }}px;-webkit-font-smoothing:antialiased;">
    <div style="display:flex;align-items:center;gap:28px;">
      <span aria-hidden="true" style="position:relative;width:96px;height:96px;flex:none;border-radius:24px;background:#0F1113;box-shadow:inset 0 0 0 2px rgba(255,255,255,0.08);"><span style="position:absolute;left:44px;top:18px;width:6px;height:58px;border-radius:3px;background:#F5F5F7;"></span><span style="position:absolute;left:29px;top:46px;width:36px;height:6px;border-radius:3px;background:#F5F5F7;"></span><span style="position:absolute;left:68px;top:62px;width:11px;height:14px;border-radius:3px;background:#2FD67B;"></span></span>
      <span style="font-size:64px;font-weight:600;letter-spacing:-0.03em;">doji</span>
      <sc-if value="{{ square }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-family:'Geist Mono',monospace;font-size:40px;color:#A1A1A6;">@[handle]</span></sc-if>
    </div>
    <sc-if value="{{ story }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;"></div>
      <span style="font-family:'Geist Mono',monospace;font-size:48px;color:#A1A1A6;">@[handle]</span>
    </sc-if>
    <div style="display:flex;flex-direction:column;gap:{{ blockGap }}px;">
      <sc-for list="{{ halves }}" as="h" hint-placeholder-count="2">
        <div style="display:flex;flex-direction:column;gap:14px;">
          <span style="font-family:'Geist Mono',monospace;font-size:26px;color:#A1A1A6;">{{ h.l }}</span>
          <div style="display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-template-columns:repeat(27,minmax(0,1fr));gap:{{ cellGap }}px;aspect-ratio:{{ ar }};">
            <sc-for list="{{ h.days }}" as="d" hint-placeholder-count="189"><span style="border-radius:{{ cellR }}px;box-sizing:border-box;background:{{ d.bg }};border:2px solid {{ d.bd }};"></span></sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:24px;">
      <span style="font-family:'Geist Mono',monospace;font-size:44px;font-weight:500;border:3px solid #F5F5F7;border-radius:999px;padding:8px 28px;">H4</span>
      <span style="font-size:40px;color:#A1A1A6;">disciplined</span>
      <span style="margin-left:auto;font-family:'Geist Mono',monospace;font-size:44px;">[n]-day streak</span>
    </div>
    <sc-if value="{{ story }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;"></div>
      <span style="font-size:40px;line-height:1.35;color:#A1A1A6;">every square is a day i kept my word.</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:324,&quot;height&quot;:576},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;story&quot;,&quot;square&quot;],&quot;default&quot;:&quot;story&quot;,&quot;tsType&quot;:&quot;'story'|'square'&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.3,&quot;min&quot;:0.1,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
const LV=['#101A14','#16391F','#1E6B3E','#27A35C','#2FD67B'];
const YEAR=Array.from({length:371},(_,i)=>{if(i>270)return {bg:'transparent',bd:'#17191C'};const v=(i*7+(i%5)*3+(i>>3))%9;return {bg:LV[v<1?0:v<3?1:v<5?2:v<7?3:4],bd:'transparent'};});
class Component extends DCLogic {
  renderVals(){
    const story=(this.props.variant??'story')!=='square';
    const s=this.props.scale??0.3;
    const H=story?1920:1080;
    return {story,square:!story,s,H,
      label:story?'share card · story 1080×1920':'share card · square 1080×1080',
      box:{w:Math.round(1080*s),h:Math.round(H*s),r:this.props.radius??0},
      pad:story?96:80,gap:story?48:40,blockGap:story?56:32,cellGap:story?7:6,cellR:story?6:5,ar:'27/7',
      halves:[{l:'jan – jun',days:YEAR.slice(0,189)},{l:'jul – dec',days:YEAR.slice(189)}]};
  }
}
</script>
</body>
</html>
